<!DOCTYPE html>
<html lang = "en">
    <head>
        <meta charset = "UTF-8">
        <title>PawNest-Forgot Password</title>
        <link rel = "stylesheet" href = "css\login_register.css">
    </head>
    <body class = "container">
        <div class = "welcomeSection">

            <div class = "logo">
                <img src = "PawNest_Assets\logo\logo-horizontal-white.png" alt ="PawNest Logo">
            </div>

            <div class = "heroDog">
                <img src = "PawNest_Assets\mascots\hero-dog-and-cat.png" alt = "Dog and Cat">
            </div>
            
            <div class = "welcomeText">
                <h1>Welcome to the family</h1>
                <p>Pets, supplies and friendly sellers in one place.</p>
            </div>

        </div>
        <div class="loginSection">
            <div class="loginCard">

                <h1>Reset Password</h1>
                <p class="subtitle">Enter your new password below.</p>

                <form id="forgotPasswordForm" novalidate>
                    <div class="form-group">
                        <label for="newPassword">New Password</label>
                        <input type="password" id="newPassword" name="newPassword" placeholder="Enter new password">
                        <span class="error" id="newPasswordError"></span>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm new password">
                        <span class="error" id="confirmPasswordError"></span>
                    </div>

                    <div class="options">
                        <label>
                            <input type="checkbox" id="showPassword">Show password
                        </label>
                    </div>

                    <button type="submit" class="btn">Reset Password</button>

                    <div class="register-section">
                        <p>Remember your password?<a href="Login.html">Log in</a></p>
                    </div>

                </form>
            </div>
        </div>

        <script src="js\forgotPassword.js"></script>
        
    </body>
</html>
